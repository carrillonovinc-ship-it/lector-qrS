
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Lector QR - Modo Profesor</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #111;
}

#lector {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #111;
}

#lector video {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
}

#lector > div {
  border: 0 !important;
}

#lector img,
#lector canvas {
  max-width: 100%;
}

#lector__dashboard_section,
#lector__status_span,
#lector__header_message {
  display: none !important;
}

#interfaz {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.25),
    transparent 22%,
    transparent 75%,
    rgba(0,0,0,.42)
  );
}

#barra {
  position: absolute;
  top: max(16px, env(safe-area-inset-top));
  left: 18px;
  right: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  text-shadow: 0 1px 5px #000;
}

#titulo {
  font-size: 16px;
  font-weight: 600;
}

#contador {
  font-size: 12px;
  white-space: nowrap;
}

#estado {
  position: absolute;
  top: 10%;
  width: 100%;
  padding: 0 16px;
  text-align: center;
  font-size: 15px;
  text-shadow: 0 1px 5px #000;
}

/* Marco de lectura completo y adaptable */
#marco {
  position: absolute;
  top: 36%;
  left: 50%;
  transform: translate(-50%, -50%);

  width: min(88vw, 430px);
  height: min(88vw, 430px, 46vh);

  border: 1px solid rgba(255,255,255,.25);
  background: rgba(255,255,255,.025);
  box-shadow: 0 0 0 100vmax rgba(0,0,0,.13);
}

.esquina {
  position: absolute;
  width: 34px;
  height: 34px;
  border-color: #fff;
  border-style: solid;
  filter: drop-shadow(0 0 2px #000);
}

.sup-izq {
  top: -2px;
  left: -2px;
  border-width: 4px 0 0 4px;
}

.sup-der {
  top: -2px;
  right: -2px;
  border-width: 4px 4px 0 0;
}

.inf-izq {
  bottom: -2px;
  left: -2px;
  border-width: 0 0 4px 4px;
}

.inf-der {
  bottom: -2px;
  right: -2px;
  border-width: 0 4px 4px 0;
}

/* Línea verde: recorre todo el marco */
#linea {
  position: absolute;
  top: 0;
  left: 2%;
  right: 2%;
  height: 3px;
  background: #00ff66;
  box-shadow:
    0 0 7px #00ff66,
    0 0 14px #00ff66;
  animation: barrido 2s ease-in-out infinite alternate;
}

@keyframes barrido {
  from { top: 0; }
  to { top: calc(100% - 3px); }
}

#instruccion {
  position: absolute;
  top: calc(36% + min(44vw, 23vh) + 18px);
  width: 100%;
  padding: 0 14px;
  text-align: center;
  font-size: 16px;
  text-shadow: 0 1px 5px #000;
}

#zonaInferior {
  position: absolute;
  bottom: calc(5% + env(safe-area-inset-bottom));
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 36px;
  pointer-events: auto;
}

.control {
  border: 0;
  background: transparent;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  padding: 8px 14px;
  cursor: pointer;
}

.icono {
  font-size: 30px;
  line-height: 1;
}

#botonQR {
  color: #12a7f5;
  font-weight: bold;
}

#resultado {
  position: absolute;
  z-index: 10;
  top: 15%;
  left: 7%;
  right: 7%;
  display: none;
  padding: 14px;
  text-align: center;
  background: rgba(0,0,0,.91);
  border: 1px solid #555;
  border-radius: 12px;
  font-size: 15px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  pointer-events: none;
}

#resultado.exito {
  border-color: #00ff66;
  color: #00ff66;
}

#resultado.repetido {
  border-color: #ffbf47;
  color: #ffbf47;
}

#btnIniciar {
  position: absolute;
  z-index: 20;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 15px 24px;
  border: 0;
  border-radius: 9px;
  background: #087fc1;
  color: #fff;
  font-size: 17px;
  font-weight: bold;
  white-space: nowrap;
  box-shadow: 0 4px 18px #0008;
}

.oculto {
  display: none !important;
}

button:disabled {
  opacity: .55;
}

@media (max-height: 600px) {
  #marco {
    top: 39%;
    width: min(72vw, 300px);
    height: min(72vw, 300px, 42vh);
  }

  #instruccion {
    top: calc(39% + min(36vw, 21vh) + 15px);
    font-size: 14px;
  }

  #zonaInferior {
    bottom: calc(2% + env(safe-area-inset-bottom));
  }
}
</style>
</head>

<body>
<div id="app">

  <div id="lector"></div>

  <div id="interfaz">
    <div id="barra">
      <span id="titulo">Escáner QR - Profesor</span>
      <span id="contador">0 leídos</span>
    </div>

    <div id="estado">Pulse iniciar para activar la cámara</div>

    <div id="marco">
      <span class="esquina sup-izq"></span>
      <span class="esquina sup-der"></span>
      <span class="esquina inf-izq"></span>
      <span class="esquina inf-der"></span>
      <div id="linea"></div>
    </div>

    <div id="instruccion">
      Coloca el código dentro del recuadro
    </div>

    <div id="zonaInferior">
      <button class="control" id="btnLinterna" type="button">
        <span class="icono">🔦</span>
        <span>Linterna</span>
      </button>

      <button class="control" id="botonQR" type="button">
        <span class="icono">▤</span>
        <span>Código QR</span>
      </button>
    </div>
  </div>

  <div id="resultado" role="status" aria-live="polite"></div>

  <button id="btnIniciar" type="button">
    📷 Iniciar escáner
  </button>
</div>

<script>
'use strict';

const $ = id => document.getElementById(id);

let reader = null;
let activo = false;
let iniciando = false;
let linterna = false;
let total = 0;
let vozDisponible = null;
let temporizadorMensaje = null;
let ultimoCodigo = '';
let ultimoTiempo = 0;
let bloqueoQR = false;
let ventanaEnlaces = null;

const registrosHoy = new Map();

/* Fecha local del dispositivo. */
function hoy() {
  const d = new Date();
  const anio = d.getFullYear();
  const mes = String(d.getMonth() + 1).padStart(2, '0');
  const dia = String(d.getDate()).padStart(2, '0');
  return `${anio}-${mes}-${dia}`;
}

/* Voz en español. */
function cargarVoz() {
  if (!('speechSynthesis' in window)) return;

  const voces = speechSynthesis.getVoices();

  vozDisponible =
    voces.find(v => /^es/i.test(v.lang)) ||
    voces[0] ||
    null;
}

if ('speechSynthesis' in window) {
  cargarVoz();
  speechSynthesis.onvoiceschanged = cargarVoz;
}

function hablar(texto) {
  if (!('speechSynthesis' in window)) return;

  cargarVoz();

  const mensaje = new SpeechSynthesisUtterance(texto);
  if (vozDisponible) mensaje.voice = vozDisponible;

  mensaje.lang = vozDisponible?.lang || 'es-ES';
  mensaje.pitch = 1;
  mensaje.rate = 1;
  mensaje.volume = 1;

  speechSynthesis.cancel();
  speechSynthesis.speak(mensaje);
}

function mostrar(texto, tipo = '', duracion = 2500) {
  const caja = $('resultado');

  caja.textContent = texto;
  caja.className = tipo;
  caja.style.display = 'block';

  clearTimeout(temporizadorMensaje);

  temporizadorMensaje = setTimeout(() => {
    caja.style.display = 'none';
    caja.className = '';
  }, duracion);
}

function actualizarContador() {
  $('contador').textContent = total + ' leídos';
}

function esURL(texto) {
  try {
    const u = new URL(texto);
    return (
      (u.protocol === 'https:' || u.protocol === 'http:') &&
      !!u.hostname
    );
  } catch (_) {
    return false;
  }
}

/*
 * No se abre ninguna pestaña al iniciar la cámara.
 * Se intenta abrir el enlace únicamente cuando se lee el QR.
 */
function abrirEnlace(url) {
  if (!esURL(url)) return false;

  try {
    /*
     * Reutilizar una pestaña secundaria si existe.
     * No se crea una pestaña en blanco al iniciar.
     */
    if (ventanaEnlaces && !ventanaEnlaces.closed) {
      ventanaEnlaces.location.href = url;
      return true;
    }

    const nueva = window.open(url, '_blank');

    if (nueva) {
      ventanaEnlaces = nueva;
      return true;
    }
  } catch (e) {
    console.warn('No se pudo abrir el enlace:', e);
  }

  return false;
}

/*
 * Procesa el QR sin detener la cámara.
 * Evita repetir el mismo código durante 2,5 segundos.
 */
function procesarQR(textoQR) {
  const codigo = String(textoQR || '').trim();
  const ahora = Date.now();

  if (!codigo || !activo) return;

  if (
    codigo === ultimoCodigo &&
    ahora - ultimoTiempo < 2500
  ) {
    return;
  }

  ultimoCodigo = codigo;
  ultimoTiempo = ahora;

  total++;
  actualizarContador();

  const fecha = hoy();

  if (registrosHoy.get(codigo) === fecha) {
    mostrar('Ya se encuentra registrado ❗', 'repetido', 3000);
    hablar('Ya se encuentra registrado');
  } else {
    registrosHoy.set(codigo, fecha);
    mostrar('Asistencia registrada ✅', 'exito', 2500);
    hablar('Asistencia registrada');
  }

  /*
   * Cada lectura válida que contiene una URL genera
   * un intento de apertura, incluso si está repetida.
   */
  if (esURL(codigo)) {
    const abierto = abrirEnlace(codigo);

    if (!abierto) {
      mostrar(
        'QR leído, pero Chrome bloqueó la apertura del enlace. ' +
        'Revisa los permisos de ventanas emergentes.',
        '',
        4500
      );
    }
  }
}

/* Ajusta el área de detección al marco visible. */
function obtenerCajaEscaneo() {
  const marco = $('marco').getBoundingClientRect();

  return {
    width: Math.max(100, Math.floor(marco.width)),
    height: Math.max(100, Math.floor(marco.height))
  };
}

/* Inicio de cámara en la pestaña actual. */
async function iniciarLector() {
  if (activo || iniciando) return;

  iniciando = true;
  $('btnIniciar').disabled = true;
  $('estado').textContent = 'Solicitando permiso de cámara…';

  try {
    if (!window.isSecureContext ||
        !navigator.mediaDevices?.getUserMedia) {
      throw new Error(
        'La cámara requiere HTTPS. Abre la página desde GitHub Pages.'
      );
    }

    if (typeof Html5Qrcode === 'undefined') {
      throw new Error(
        'No se pudo cargar el lector QR. Comprueba tu conexión a Internet.'
      );
    }

    /*
     * Solicitar el permiso explícitamente desde el botón.
     * Esto permite detectar errores de permiso antes de iniciar
     * la biblioteca del lector.
     */
    let stream;

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: 'environment' }
        }
      });
    } catch (e) {
      if (e.name === 'NotAllowedError' ||
          e.name === 'PermissionDeniedError') {
        throw new Error(
          'Chrome denegó el permiso de cámara. ' +
          'En Chrome, abre los ajustes del sitio, permite Cámara ' +
          'y vuelve a pulsar Iniciar escáner.'
        );
      }
      throw e;
    }

    /*
     * Liberar la cámara de prueba; Html5Qrcode la abrirá
     * inmediatamente después para comenzar a escanear.
     */
    stream.getTracks().forEach(track => track.stop());

    if (reader) {
      try {
        await reader.stop();
      } catch (_) {}

      try {
        reader.clear();
      } catch (_) {}

      reader = null;
    }

    $('lector').innerHTML = '';

    reader = new Html5Qrcode('lector', {
      verbose: false,
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE
      ],
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    });

    const caja = obtenerCajaEscaneo();

    await reader.start(
      { facingMode: 'environment' },
      {
        fps: 20,
        qrbox: caja,
        aspectRatio: window.innerWidth / window.innerHeight,
        disableFlip: false
      },
      procesarQR,
      () => {}
    );

    activo = true;
    linterna = false;

    $('btnIniciar').classList.add('oculto');
    $('estado').textContent = 'Cámara activa';
    $('instruccion').textContent =
      'Coloca el código dentro del recuadro';

  } catch (e) {
    console.error('Error de cámara:', e);

    activo = false;

    $('estado').textContent = 'No se pudo iniciar la cámara';

    mostrar(
      e.message || 'No se pudo acceder a la cámara.',
      '',
      6000
    );

    if (reader) {
      try {
        await reader.stop();
      } catch (_) {}

      try {
        reader.clear();
      } catch (_) {}

      reader = null;
    }

    $('btnIniciar').classList.remove('oculto');

  } finally {
    iniciando = false;
    $('btnIniciar').disabled = false;
  }
}

/* Linterna. */
async function alternarLinterna() {
  if (!reader || !activo) {
    mostrar('Inicia primero el escáner.');
    return;
  }

  try {
    const nuevoEstado = !linterna;

    await reader.applyVideoConstraints({
      advanced: [{ torch: nuevoEstado }]
    });

    linterna = nuevoEstado;

    $('btnLinterna').querySelector('.icono').textContent =
      linterna ? '💡' : '🔦';

    mostrar(
      linterna ? 'Linterna encendida' : 'Linterna apagada'
    );
  } catch (e) {
    linterna = false;
    $('btnLinterna').querySelector('.icono').textContent = '🔦';

    mostrar('La linterna no está disponible en este dispositivo.');
  }
}

/* Activación directa desde el botón: no abre pestañas. */
$('btnIniciar').addEventListener('click', () => {
  if (activo || iniciando) return;

  hablar('Activando el escáner.');
  iniciarLector();
});

$('botonQR').addEventListener('click', () => {
  if (activo) {
    mostrar('Apunta la cámara al código QR.');
  } else {
    iniciarLector();
  }
});

$('btnLinterna').addEventListener('click', alternarLinterna);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;

  if (activo) {
    $('estado').textContent = 'Cámara activa';
  } else if (!iniciando) {
    $('estado').textContent =
      'Pulsa iniciar para activar la cámara.';
  }
});
</script>
</body>
</html>
