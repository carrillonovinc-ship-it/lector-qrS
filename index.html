
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Lector QR - Asistencia continua</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif}
#app,#lector{position:fixed;inset:0;background:#111}
#lector video{width:100%!important;height:100%!important;object-fit:cover!important}
#lector>div{border:0!important}
#lector__dashboard_section,#lector__status_span,#lector__header_message{display:none!important}
#interfaz{position:fixed;inset:0;z-index:5;pointer-events:none;background:linear-gradient(to bottom,#0005,transparent 25%,transparent 75%,#0006)}
#barra{position:absolute;top:max(16px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;gap:10px;text-shadow:0 1px 5px #000}
#titulo{font-size:16px;font-weight:bold}
#contador{font-size:13px;white-space:nowrap}
#estado{position:absolute;top:9%;width:100%;padding:0 12px;text-align:center;font-size:15px;text-shadow:0 1px 5px #000}
#marco{position:absolute;left:50%;top:39%;transform:translate(-50%,-50%);width:min(92vw,75vh,650px);height:min(92vw,75vh,650px);border:1px solid #ffffff55;box-shadow:0 0 0 100vmax #0002}
.esquina{position:absolute;width:32px;height:32px;border-color:#fff;border-style:solid;filter:drop-shadow(0 0 3px #000)}
.sup-izq{top:-2px;left:-2px;border-width:4px 0 0 4px}
.sup-der{top:-2px;right:-2px;border-width:4px 4px 0 0}
.inf-izq{bottom:-2px;left:-2px;border-width:0 0 4px 4px}
.inf-der{bottom:-2px;right:-2px;border-width:0 4px 4px 0}
#linea{position:absolute;left:2%;right:2%;top:0;height:3px;background:#00ff54;box-shadow:0 0 12px #00ff54;animation:barrido 1.6s linear infinite alternate}
@keyframes barrido{from{top:0}to{top:calc(100% - 3px)}}
#instruccion{position:absolute;top:calc(39% + min(46vw,37.5vh) + 15px);width:100%;text-align:center;padding:0 12px;font-size:15px;text-shadow:0 1px 5px #000}
#zonaInferior{position:absolute;bottom:calc(3% + env(safe-area-inset-bottom));left:0;width:100%;display:flex;justify-content:center;align-items:center;gap:36px;pointer-events:auto}
.control{border:0;background:#1119;color:#fff;border-radius:12px;padding:12px 20px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:14px}
.icono{font-size:27px}
#resultado{position:absolute;z-index:10;top:15%;left:6%;right:6%;display:none;padding:16px 12px;text-align:center;background:#000e;border:1px solid #777;border-radius:12px;font-size:18px;font-weight:bold;overflow-wrap:anywhere;pointer-events:none}
#btnIniciar{position:fixed;z-index:20;top:50%;left:50%;transform:translate(-50%,-50%);padding:16px 24px;border:0;border-radius:12px;background:#087fc1;color:#fff;font-size:17px;font-weight:bold}
.oculto{display:none!important}
button:disabled{opacity:.55}
</style>
</head>

<body>
<div id="app">
  <div id="lector"></div>

  <div id="interfaz">
    <div id="barra">
      <span id="titulo">Escáner QR - Profesor</span>
      <span id="contador">0 leídos</span>
    </div>
    <div id="estado">Pulse iniciar para activar la cámara</div>

    <div id="marco">
      <span class="esquina sup-izq"></span>
      <span class="esquina sup-der"></span>
      <span class="esquina inf-izq"></span>
      <span class="esquina inf-der"></span>
      <div id="linea"></div>
    </div>

    <div id="instruccion">Coloca el código dentro del recuadro</div>

    <div id="zonaInferior">
      <button class="control" id="btnLinterna" type="button">
        <span class="icono">🔦</span><span>Linterna</span>
      </button>
      <button class="control" id="botonQR" type="button">
        <span class="icono">▤</span><span>Escanear</span>
      </button>
    </div>
  </div>

  <div id="resultado" role="status" aria-live="polite"></div>
  <button id="btnIniciar" type="button">📷 Iniciar escáner</button>
</div>

<script>
'use strict';

const $ = id => document.getElementById(id);

let lector = null;
let activo = false;
let iniciando = false;
let linterna = false;
let total = 0;
let temporizador = null;
let voz = null;
let ultimoAviso = 0;
let ultimoDuplicado = '';

/*
 * El registro local es válido únicamente durante esta sesión.
 * La confirmación real debe proceder del servidor de asistencia.
 */
const vistos = new Map();
const pendientes = new Set();
const confirmados = new Set();
const reintentos = new Map();
const colaVoz = [];
let hablando = false;

function cargarVoz() {
  if (!('speechSynthesis' in window)) return;
  const voces = speechSynthesis.getVoices();
  voz =
    voces.find(v => /^es-419$/i.test(v.lang)) ||
    voces.find(v => /^es/i.test(v.lang)) ||
    null;
}

if ('speechSynthesis' in window) {
  cargarVoz();
  speechSynthesis.onvoiceschanged = cargarVoz;
}

function hablar(texto) {
  if (!('speechSynthesis' in window)) return;

  colaVoz.push(texto);
  reproducirVoz();
}

function reproducirVoz() {
  if (hablando || !colaVoz.length) return;

  hablando = true;
  const mensaje = new SpeechSynthesisUtterance(colaVoz.shift());

  mensaje.lang = voz?.lang || 'es-ES';
  mensaje.rate = 0.95;
  mensaje.pitch = 1;
  mensaje.volume = 1;
  if (voz) mensaje.voice = voz;

  mensaje.onend = () => {
    hablando = false;
    reproducirVoz();
  };

  mensaje.onerror = () => {
    hablando = false;
    reproducirVoz();
  };

  speechSynthesis.speak(mensaje);
}

function mostrar(texto, duracion = 2500) {
  const caja = $('resultado');
  caja.textContent = texto;
  caja.style.display = 'block';

  clearTimeout(temporizador);
  temporizador = setTimeout(() => {
    caja.style.display = 'none';
  }, duracion);
}

function avisar(texto, duracion = 2500) {
  mostrar(texto, duracion);
  hablar(texto);
}

function actualizar() {
  $('contador').textContent = total + ' leídos';
}

function esURL(texto) {
  try {
    const u = new URL(texto);
    return ['http:', 'https:'].includes(u.protocol) && !!u.hostname;
  } catch (_) {
    return false;
  }
}

async function iniciarEscaner() {
  if (activo || iniciando) return;

  iniciando = true;
  $('btnIniciar').disabled = true;
  $('estado').textContent = 'Activando cámara trasera…';

  try {
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      throw new Error('Abre el lector con HTTPS y permite el acceso a la cámara.');
    }

    if (typeof Html5Qrcode === 'undefined') {
      throw new Error('No se pudo cargar la librería QR. Revisa Internet.');
    }

    lector = new Html5Qrcode('lector', {
      verbose: false,
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    });

    const lado = Math.floor(Math.min(
      window.innerWidth * 0.90,
      window.innerHeight * 0.62,
      650
    ));

    await lector.start(
      { facingMode: 'environment' },
      {
        fps: 20,
        qrbox: { width: lado, height: lado },
        aspectRatio: 1,
        disableFlip: false
      },
      onScan,
      () => {}
    );

    activo = true;
    $('btnIniciar').classList.add('oculto');
    $('estado').textContent = 'Cámara activa · lectura continua';
    $('instruccion').textContent = 'Coloca cada código dentro del recuadro';

    avisar('Escáner activado. Puede comenzar a registrar asistencias.');

  } catch (error) {
    console.error(error);
    $('estado').textContent = 'No se pudo activar la cámara';
    mostrar(error.message || String(error), 4500);

    if (lector) {
      try { await lector.stop(); } catch (_) {}
      try { await lector.clear(); } catch (_) {}
      lector = null;
    }

    activo = false;
    $('btnIniciar').classList.remove('oculto');

  } finally {
    iniciando = false;
    $('btnIniciar').disabled = false;
  }
}

async function onScan(texto) {
  const codigo = String(texto || '').trim();
  if (!codigo) return;

  const ahora = Date.now();

  /*
   * No repetir la solicitud si el mismo código ya está
   * pendiente o se procesó durante la sesión.
   */
  if (vistos.has(codigo) || pendientes.has(codigo)) {
    if (
      codigo !== ultimoDuplicado ||
      ahora - ultimoAviso > 2500
    ) {
      ultimoDuplicado = codigo;
      ultimoAviso = ahora;
      avisar('YA SE REGISTRÓ SU ASISTENCIA', 3000);
    }
    return;
  }

  if (!esURL(codigo)) {
    avisar('El código leído no contiene un enlace web válido.');
    return;
  }

  vistos.set(codigo, ahora);
  pendientes.add(codigo);
  total++;
  actualizar();

  $('estado').textContent = 'Enviando solicitud de asistencia…';
  mostrar('Código QR leído. Procesando…');

  try {
    /*
     * IMPORTANTE:
     * no-cors no permite leer la respuesta del servidor.
     * El resultado de esta operación no confirma por sí
     * solo que la asistencia haya quedado guardada.
     */
    await fetch(codigo, {
      method: 'GET',
      mode: 'no-cors',
      cache: 'no-store',
      redirect: 'follow',
      keepalive: true
    });

    $('estado').textContent = 'Cámara activa · lectura continua';
    mostrar('Solicitud enviada. Continúe con el siguiente QR.');

  } catch (error) {
    console.error('Error de red:', error);

    /*
     * Se libera el código para permitir otro intento.
     * El servidor debe evitar duplicados por su cuenta,
     * porque no sabemos si recibió la solicitud anterior.
     */
    vistos.delete(codigo);
    reintentos.set(codigo, (reintentos.get(codigo) || 0) + 1);

    avisar('Error de conexión. Vuelva a escanear el QR.', 3500);

  } finally {
    pendientes.delete(codigo);
  }
}

async function alternarLinterna() {
  if (!lector || !activo) {
    mostrar('Inicia primero el escáner.');
    return;
  }

  try {
    const nueva = !linterna;

    await lector.applyVideoConstraints({
      advanced: [{ torch: nueva }]
    });

    linterna = nueva;
    $('btnLinterna').querySelector('.icono').textContent =
      linterna ? '💡' : '🔦';

    mostrar(linterna ? 'Linterna encendida' : 'Linterna apagada');

  } catch (error) {
    linterna = false;
    $('btnLinterna').querySelector('.icono').textContent = '🔦';
    mostrar('La linterna no está disponible en este dispositivo.');
  }
}

$('btnIniciar').addEventListener('click', () => {
  if ('speechSynthesis' in window) {
    cargarVoz();
    speechSynthesis.resume();
  }
  iniciarEscaner();
});

$('botonQR').addEventListener('click', () => {
  if (activo) {
    mostrar('Apunta al siguiente código QR.');
  } else {
    iniciarEscaner();
  }
});

$('btnLinterna').addEventListener('click', alternarLinterna);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;

  $('estado').textContent = activo
    ? 'Cámara activa · lectura continua'
    : 'Pulsa iniciar para activar la cámara';
});
</script>
</body>
</html>
