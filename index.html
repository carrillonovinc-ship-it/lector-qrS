<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Registro de Asistencia - Modo Profesor</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  </head>

  <body style="font-family:sans-serif; text-align:center;">
    <h2>📷 Escáner QR - Modo Profesor</h2>

    <!-- Botón inicial (necesario para desbloquear audio en móviles) -->
    <button id="btnIniciar" style="padding:12px 25px; font-size:16px; margin:20px;">
      🔊 Iniciar escáner
    </button>

    <div id="lector" style="width: 350px; margin:auto; display:none;"></div>
    <p id="msg" style="font-size: 18px; font-weight: bold; color: green;"></p>

    <script>
      let reader;
      const registrosHoy = {};
      let vozDisponible = null;

      // Obtener fecha actual
      function hoy() {
        const d = new Date();
        return d.toISOString().split("T")[0];
      }

      // Configurar voz en español
      function cargarVoz() {
        const voces = window.speechSynthesis.getVoices();
        vozDisponible =
          voces.find(v => v.lang.startsWith("es")) ||
          voces.find(v => v.lang === "es-ES") ||
          voces[0];
      }

      window.speechSynthesis.onvoiceschanged = cargarVoz;

      // 🔊 Función para hablar texto
      function hablar(texto) {
        if (!vozDisponible) cargarVoz();
        const msg = new SpeechSynthesisUtterance(texto);
        msg.voice = vozDisponible;
        msg.lang = "es-ES";
        msg.pitch = 1;
        msg.rate = 1;
        window.speechSynthesis.cancel(); // detener voces previas
        window.speechSynthesis.speak(msg);
      }

      async function iniciarLector() {
        document.getElementById("lector").style.display = "block";
        const lectorDiv = document.getElementById("lector");
        lectorDiv.innerHTML = "";
        reader = new Html5Qrcode("lector");

        reader
          .start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            async textoQR => {
              reader.stop();

              try {
                const fecha = hoy();
                const claveQR = textoQR.trim();
                const msg = document.getElementById("msg");

                if (registrosHoy[claveQR] === fecha) {
                  msg.innerText = "Ya se encuentra registrado ❗";
                  hablar("Ya se encuentra registrado");
                } else {
                  registrosHoy[claveQR] = fecha;
                  msg.innerText = "Asistencia registrada ✅";
                  hablar("Asistencia registrada");

                  // Solo abre enlaces válidos la primera vez
                  if (/^https?:\/\//i.test(claveQR)) {
                    const win = window.open(claveQR, "_blank");
                    setTimeout(() => {
                      if (win && !win.closed) win.close();
                    }, 1000);
                  }
                }

                // Reiniciar el lector luego de unos segundos
                setTimeout(() => {
                  msg.innerText = "";
                  iniciarLector();
                }, 2000);
              } catch (err) {
                console.error("Error al procesar QR:", err);
                hablar("Ocurrió un error al procesar el código");
                iniciarLector();
              }
            },
            error => {}
          )
          .catch(err => {
            alert("Error al acceder a la cámara: " + err);
          });
      }

      // Botón inicial para activar sonido y cámara
      document.getElementById("btnIniciar").addEventListener("click", () => {
        hablar("Escáner activado, puede comenzar a registrar asistencias.");
        document.getElementById("btnIniciar").style.display = "none";
        iniciarLector();
      });
    </script>
  </body>
</html>
