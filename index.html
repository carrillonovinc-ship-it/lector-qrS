
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Registro de Asistencia - Modo Profesor</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
  background: #111;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  touch-action: manipulation;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #111;
}

#lector {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #111;
  overflow: hidden;
}

#lector video {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
}

#lector > div {
  border: 0 !important;
}

#lector img,
#lector canvas {
  max-width: 100%;
}

#lector__dashboard_section,
#lector__status_span,
#lector__header_message {
  display: none !important;
}

#interfaz {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.30),
    transparent 27%,
    transparent 70%,
    rgba(0,0,0,.48)
  );
}

#barra {
  position: absolute;
  top: max(18px, env(safe-area-inset-top));
  left: 18px;
  right: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  text-shadow: 0 1px 5px #000;
}

#titulo {
  font-size: 16px;
  font-weight: bold;
}

#contador {
  font-size: 12px;
  white-space: nowrap;
}

#estado {
  position: absolute;
  top: 10%;
  width: 100%;
  padding: 0 20px;
  text-align: center;
  font-size: 15px;
  text-shadow: 0 1px 5px #000;
}

#marco {
  position: absolute;
  width: min(84vw, 360px, 40dvh);
  height: min(84vw, 360px, 40dvh);
  top: 42%;
  left: 50%;
  transform: translate(-50%, -50%);
  border: 1px solid rgba(255,255,255,.25);
  background: rgba(255,255,255,.025);
  box-shadow: 0 0 0 100vmax rgba(0,0,0,.13);
  overflow: hidden;
}

.esquina {
  position: absolute;
  width: 28px;
  height: 28px;
  border-color: #fff;
  border-style: solid;
  filter: drop-shadow(0 0 2px #000);
}

.sup-izq {
  top: -2px;
  left: -2px;
  border-width: 4px 0 0 4px;
}

.sup-der {
  top: -2px;
  right: -2px;
  border-width: 4px 4px 0 0;
}

.inf-izq {
  bottom: -2px;
  left: -2px;
  border-width: 0 0 4px 4px;
}

.inf-der {
  bottom: -2px;
  right: -2px;
  border-width: 0 4px 4px 0;
}

/* Línea verde animada */

#linea {
  position: absolute;
  top: 0;
  left: 3%;
  right: 3%;
  height: 2px;
  background: #00ff66;
  box-shadow: 0 0 7px #00ff66, 0 0 14px #00ff66;
  animation: barrido 2.2s linear infinite alternate;
  pointer-events: none;
}

@keyframes barrido {
  from { top: 0; }
  to { top: calc(100% - 2px); }
}

#instruccion {
  position: absolute;
  top: calc(42% + min(42vw, 180px) + 16px);
  width: 100%;
  padding: 0 14px;
  text-align: center;
  font-size: 16px;
  text-shadow: 0 1px 5px #000;
}

#zonaInferior {
  position: absolute;
  bottom: calc(3% + env(safe-area-inset-bottom));
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 36px;
  pointer-events: auto;
}

.control {
  border: 0;
  background: transparent;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  padding: 8px 14px;
  cursor: pointer;
}

.icono {
  font-size: 30px;
  line-height: 1;
}

#botonQR {
  color: #12a7f5;
  font-weight: bold;
}

#btnApagar {
  color: #ff7777;
  font-weight: bold;
}

#resultado {
  position: absolute;
  z-index: 10;
  top: 16%;
  left: 7%;
  right: 7%;
  display: none;
  padding: 14px;
  text-align: center;
  background: rgba(0,0,0,.90);
  border: 1px solid #555;
  border-radius: 12px;
  font-size: 16px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  pointer-events: none;
}

#resultado.exito {
  border-color: #00ff66;
  color: #00ff66;
}

#resultado.repetido {
  border-color: #ffbf47;
  color: #ffbf47;
}

#btnIniciar {
  position: absolute;
  z-index: 20;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 15px 24px;
  border: 0;
  border-radius: 9px;
  background: #087fc1;
  color: white;
  font-size: 17px;
  font-weight: bold;
  white-space: nowrap;
  box-shadow: 0 4px 18px #0008;
}

.oculto {
  display: none !important;
}

button:disabled {
  opacity: .55;
}

@media (max-height: 600px) {
  #marco {
    top: 39%;
    width: min(62vw, 260px, 38dvh);
    height: min(62vw, 260px, 38dvh);
  }

  #instruccion {
    top: calc(39% + min(31vw, 130px, 19dvh) + 12px);
    font-size: 13px;
  }

  #zonaInferior {
    bottom: calc(1% + env(safe-area-inset-bottom));
    gap: 24px;
  }

  #estado { top: 9%; font-size: 13px; }
}
</style>
</head>

<body>
<div id="app">

  <div id="lector"></div>

  <div id="interfaz">

    <div id="barra">
      <span id="titulo">Escáner QR - Profesor</span>
      <span id="contador">0 leídos</span>
    </div>

    <div id="estado">Pulse iniciar para activar la cámara</div>

    <div id="marco">
      <span class="esquina sup-izq"></span>
      <span class="esquina sup-der"></span>
      <span class="esquina inf-izq"></span>
      <span class="esquina inf-der"></span>
      <div id="linea"></div>
    </div>

    <div id="instruccion">
      Coloca el código dentro del recuadro
    </div>

    <div id="zonaInferior">

      <button class="control" id="btnLinterna" type="button">
        <span class="icono">🔦</span>
        <span>Linterna</span>
      </button>

      <button class="control" id="botonQR" type="button">
        <span class="icono">▤</span>
        <span>Código QR</span>
      </button>

      <button class="control oculto" id="btnApagar" type="button">
        <span class="icono">⏹</span>
        <span>Apagar lector</span>
      </button>

    </div>
  </div>

  <div id="resultado" role="status" aria-live="polite"></div>

  <button id="btnIniciar" type="button">
    📷 Iniciar escáner
  </button>

</div>

<script>
'use strict';

const $ = id => document.getElementById(id);

let reader = null;
let activo = false;
let iniciando = false;
let linterna = false;
let total = 0;
let vozDisponible = null;
let temporizadorMensaje = null;
let temporizadorLiberacion = null;
let ultimoCodigo = '';
let colaEnlacesQR = [];
let procesandoEnlacesQR = false;
let enlacesPendientes = 0;

/*
 * Encola cada enlace QR para enviarlo en segundo plano.
 * No abre pestañas ni abandona la pantalla del lector.
 * La cola procesa los enlaces uno por uno para evitar
 * que varias solicitudes se pisen entre sí.
 */
function abrirEnlaceQR(texto) {
  const enlace = String(texto || '').trim();
  if (!/^https?:\/\//i.test(enlace)) return;

  colaEnlacesQR.push({ enlace, intentos: 0 });
  enlacesPendientes++;
  actualizarEstadoCola();
  procesarColaEnlacesQR();
}

function actualizarEstadoCola() {
  if (!activo && !iniciando) return;
  if (enlacesPendientes > 0) {
    $('estado').textContent = `Cámara activa · ${enlacesPendientes} enlace(s) en proceso`;
  } else {
    $('estado').textContent = 'Cámara activa';
  }
}

async function procesarColaEnlacesQR() {
  if (procesandoEnlacesQR) return;
  procesandoEnlacesQR = true;

  try {
    while (colaEnlacesQR.length > 0) {
      const trabajo = colaEnlacesQR[0];
      try {
        /*
         * no-cors permite disparar el GET sin leer la respuesta
         * entre dominios. El navegador no cambia de pestaña.
         */
        await fetch(trabajo.enlace, {
          method: 'GET',
          mode: 'no-cors',
          cache: 'no-store',
          redirect: 'follow',
          credentials: 'omit'
        });

        colaEnlacesQR.shift();
        enlacesPendientes = Math.max(0, enlacesPendientes - 1);
        actualizarEstadoCola();
      } catch (error) {
        trabajo.intentos++;
        console.warn('No se pudo enviar el enlace QR; se reintentará:', error);

        if (trabajo.intentos < 3) {
          await new Promise(resolve => setTimeout(resolve, 700 * trabajo.intentos));
        } else {
          colaEnlacesQR.shift();
          enlacesPendientes = Math.max(0, enlacesPendientes - 1);
          actualizarEstadoCola();
          mostrar('No se pudo enviar un enlace. Comprueba la conexión a Internet.', '', 4500);
        }
      }
    }
  } finally {
    procesandoEnlacesQR = false;
    actualizarEstadoCola();
    if (colaEnlacesQR.length > 0) procesarColaEnlacesQR();
  }
}

/*
 * Registros realizados durante esta sesión.
 * La clave es el contenido completo del QR.
 */
const registrosHoy = new Map();

/*
 * Evita que un mismo QR detectado continuamente
 * provoque múltiples registros y anuncios.
 */
let codigoEnLectura = '';

/* Fecha local, sin desplazamiento UTC. */
function hoy() {
  const d = new Date();
  const anio = d.getFullYear();
  const mes = String(d.getMonth() + 1).padStart(2, '0');
  const dia = String(d.getDate()).padStart(2, '0');

  return `${anio}-${mes}-${dia}`;
}

/* Selección de voz española. */
function cargarVoz() {
  if (!('speechSynthesis' in window)) return;

  const voces = window.speechSynthesis.getVoices();

  vozDisponible =
    voces.find(v => /^es(-|_)/i.test(v.lang) &&
                    /BO|ES|MX|AR|419/i.test(v.lang)) ||
    voces.find(v => /^es/i.test(v.lang)) ||
    voces[0] ||
    null;
}

if ('speechSynthesis' in window) {
  cargarVoz();
  window.speechSynthesis.onvoiceschanged = cargarVoz;
}

/* Anuncio por voz. */
function hablar(texto) {
  if (!('speechSynthesis' in window)) return;

  cargarVoz();

  const mensaje = new SpeechSynthesisUtterance(texto);

  if (vozDisponible) {
    mensaje.voice = vozDisponible;
  }

  mensaje.lang = vozDisponible?.lang || 'es-ES';
  mensaje.pitch = 1;
  mensaje.rate = 1;
  mensaje.volume = 1;

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(mensaje);
}

/* Mensajes visuales temporales. */
function mostrar(texto, tipo = '', duracion = 2500) {
  const caja = $('resultado');

  caja.textContent = texto;
  caja.className = tipo;
  caja.style.display = 'block';

  clearTimeout(temporizadorMensaje);

  temporizadorMensaje = setTimeout(() => {
    caja.style.display = 'none';
    caja.className = '';
  }, duracion);
}

function actualizarContador() {
  $('contador').textContent = total + ' leídos';
}

/*
 * Libera el QR cuando deja de detectarse durante un tiempo.
 * Así, si se retira y se vuelve a presentar, se considera
 * una nueva lectura y se comprueba si ya estaba registrado.
 */
function programarLiberacion(codigo) {
  clearTimeout(temporizadorLiberacion);

  temporizadorLiberacion = setTimeout(() => {
    if (codigoEnLectura === codigo) {
      codigoEnLectura = '';
    }
  }, 1800);
}

/* Procesamiento de cada lectura aceptada. */
function procesarQR(textoQR) {
  const codigo = String(textoQR || '').trim();

  if (!codigo || !activo) return;

  /*
   * Mantiene bloqueada la lectura mientras el mismo QR
   * continúa visible ante la cámara.
   */
  if (codigoEnLectura === codigo) {
    programarLiberacion(codigo);
    return;
  }

  codigoEnLectura = codigo;
  programarLiberacion(codigo);

  /* Si el QR contiene un enlace web, abrirlo en la pestaña de fondo. */
  abrirEnlaceQR(codigo);

  total++;
  actualizarContador();

  const fecha = hoy();
  const fechaRegistro = registrosHoy.get(codigo);

  if (fechaRegistro === fecha) {
    mostrar('Ya se encuentra registrado ❗', 'repetido', 3000);
    hablar('Ya se encuentra registrado');
  } else {
    registrosHoy.set(codigo, fecha);

    mostrar('QR leído y enviado al sistema en segundo plano', 'exito', 2500);
    hablar('Código leído');
  }

}

/* Inicio del escáner. */
async function iniciarLector() {
  if (activo || iniciando) return;

  iniciando = true;
  $('btnIniciar').disabled = true;
  $('estado').textContent = 'Activando cámara trasera…';

  try {
    if (!window.isSecureContext ||
        !navigator.mediaDevices?.getUserMedia) {
      throw new Error(
        'Abre esta página mediante HTTPS y permite el acceso a la cámara.'
      );
    }

    if (typeof Html5Qrcode === 'undefined') {
      throw new Error(
        'No se pudo cargar el lector QR. Comprueba tu conexión a Internet.'
      );
    }

    if (reader) {
      try {
        await reader.stop();
      } catch (_) {}

      try {
        reader.clear();
      } catch (_) {}

      reader = null;
    }

    const lectorDiv = $('lector');
    lectorDiv.innerHTML = '';

    reader = new Html5Qrcode('lector', {
      verbose: false,
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE
      ],
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    });

    const lado = Math.max(150, Math.floor(Math.min(window.innerWidth * 0.78, window.innerHeight * 0.34, 360)));

    const config = {
      fps: 20,
      qrbox: {
        width: lado,
        height: lado
      },
      aspectRatio: 1,
      disableFlip: false
    };

    // Selecciona primero una cámara física trasera y pasa su ID como texto.
    // Esto evita el error de html5-qrcode cuando recibe un objeto de cámara
    // con varias claves (cameraIdOrConfig).
    let camaras = [];
    try {
      camaras = await Html5Qrcode.getCameras();
    } catch (errorCamaras) {
      console.warn('No se pudieron enumerar las cámaras inicialmente:', errorCamaras);
    }

    if (!camaras || camaras.length === 0) {
      throw new Error('No se detectaron cámaras. Permite el acceso a la cámara y vuelve a intentar.');
    }

    const camaraTrasera = camaras.find(c =>
      /back|rear|environment|trasera|posterior|world/i.test(c.label || '')
    ) || camaras[camaras.length - 1];

    await reader.start(
      camaraTrasera.id,
      config,

      /* No detener la cámara después de cada lectura. */
      textoQR => {
        procesarQR(textoQR);
      },

      /* Los errores normales de detección se ignoran. */
      () => {}
    );

    // Fuerza reproducción inline en móviles compatibles.
    const video = $('lector').querySelector('video');
    if (video) {
      video.setAttribute('playsinline', 'true');
      video.setAttribute('autoplay', 'true');
      video.muted = true;
      video.playsInline = true;

      // Solicita la mayor resolución disponible en la cámara trasera.
      // No cambia el resto del funcionamiento del lector.
      try {
        const pista = video.srcObject?.getVideoTracks?.()[0];
        if (pista) {
          const capacidades = pista.getCapabilities ? pista.getCapabilities() : {};
          const restricciones = {};
          if (capacidades.width?.max) restricciones.width = { ideal: capacidades.width.max };
          if (capacidades.height?.max) restricciones.height = { ideal: capacidades.height.max };
          if (capacidades.focusMode?.includes('continuous')) {
            restricciones.focusMode = 'continuous';
          }
          if (Object.keys(restricciones).length) {
            await pista.applyConstraints(restricciones);
          }
        }
      } catch (e) {
        console.warn('La cámara no admite resolución o enfoque mejorados:', e);
      }

      try { await video.play(); } catch (_) {}
    }

    activo = true;
    linterna = false;

    $('btnIniciar').classList.add('oculto');
    $('btnApagar').classList.remove('oculto');
    actualizarEstadoCola();
    $('instruccion').textContent =
      'Coloca el código dentro del recuadro';

  } catch (e) {
    console.error('Error al iniciar el lector:', e);

    activo = false;
    $('estado').textContent = 'No se pudo iniciar la cámara';

    let mensajeError = e.message || String(e);
    if (e && (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError')) {
      mensajeError = 'Permiso de cámara denegado. En Chrome, abre los ajustes del sitio y permite la Cámara; después vuelve a pulsar Iniciar escáner.';
    } else if (e && (e.name === 'NotFoundError' || e.name === 'DevicesNotFoundError')) {
      mensajeError = 'No se encontró una cámara disponible en este dispositivo.';
    } else if (e && (e.name === 'NotReadableError' || e.name === 'TrackStartError')) {
      mensajeError = 'La cámara está siendo utilizada por otra aplicación. Ciérrala e inténtalo de nuevo.';
    }
    mostrar(mensajeError, '', 6000);

    if (reader) {
      try {
        await reader.stop();
      } catch (_) {}

      try {
        reader.clear();
      } catch (_) {}

      reader = null;
    }

    $('btnIniciar').classList.remove('oculto');
    $('btnApagar').classList.add('oculto');

  } finally {
    iniciando = false;
    $('btnIniciar').disabled = false;
  }
}

/* Apaga la cámara y detiene el lector. Los enlaces ya encolados continúan procesándose. */
async function apagarLector() {
  if (iniciando) {
    mostrar('La cámara se está activando. Espera un momento y vuelve a pulsar.');
    return;
  }
  if (!reader && !activo) return;

  activo = false;
  linterna = false;
  clearTimeout(temporizadorLiberacion);
  codigoEnLectura = '';
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();

  try { if (reader) await reader.stop(); } catch (e) { console.warn(e); }
  try { if (reader) reader.clear(); } catch (e) { console.warn(e); }

  const video = $('lector').querySelector('video');
  if (video && video.srcObject) {
    try { video.srcObject.getTracks().forEach(track => track.stop()); } catch (_) {}
  }

  $('lector').innerHTML = '';
  reader = null;
  $('btnIniciar').classList.remove('oculto');
  $('btnApagar').classList.add('oculto');
  $('estado').textContent = 'Lector apagado';
  $('btnLinterna').querySelector('.icono').textContent = '🔦';
  mostrar(enlacesPendientes ? `Lector apagado. Quedan ${enlacesPendientes} enlace(s) por enviar.` : 'Lector apagado.');
}

/* Control de la linterna. */
async function alternarLinterna() {
  if (!reader || !activo) {
    mostrar('Inicia primero el escáner.');
    return;
  }

  try {
    const nuevoEstado = !linterna;

    await reader.applyVideoConstraints({
      advanced: [{ torch: nuevoEstado }]
    });

    linterna = nuevoEstado;

    $('btnLinterna').querySelector('.icono').textContent =
      linterna ? '💡' : '🔦';

    mostrar(
      linterna ? 'Linterna encendida' : 'Linterna apagada'
    );

  } catch (e) {
    linterna = false;

    $('btnLinterna').querySelector('.icono').textContent = '🔦';

    mostrar('La linterna no está disponible en este dispositivo.');
  }
}

/* Activación inicial mediante interacción del usuario. */
$('btnIniciar').addEventListener('click', async () => {
  if (activo || iniciando) return;

  hablar(
    'Escáner activado. Puede comenzar a registrar asistencias.'
  );

  await iniciarLector();
});

/* Botón de escaneo. */
$('botonQR').addEventListener('click', () => {
  if (activo) {
    mostrar('Apunta la cámara al código QR.');
  } else {
    iniciarLector();
  }
});

/* Botón de linterna. */
$('btnLinterna').addEventListener('click', alternarLinterna);
$('btnApagar').addEventListener('click', apagarLector);

/* Recuperación al regresar a la pestaña del lector. */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;

  if (activo) {
    actualizarEstadoCola();
    $('instruccion').textContent =
      'Coloca el código dentro del recuadro';
  } else if (!iniciando) {
    $('estado').textContent =
      'Pulsa Iniciar escáner para activar la cámara.';
  }
});

/* Limpiar temporizadores al abandonar la página. */
window.addEventListener('pagehide', () => {
  clearTimeout(temporizadorMensaje);
  clearTimeout(temporizadorLiberacion);
});
</script>
</body>
</html>
