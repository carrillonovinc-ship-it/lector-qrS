
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Registro de Asistencia - Modo Profesor</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
  background: #111;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  touch-action: manipulation;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #111;
}

#lector {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #111;
  overflow: hidden;
}

#lector video {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
}

#lector > div {
  border: 0 !important;
}

#lector img,
#lector canvas {
  max-width: 100%;
}

#lector__dashboard_section,
#lector__status_span,
#lector__header_message {
  display: none !important;
}

#interfaz {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.30),
    transparent 27%,
    transparent 70%,
    rgba(0,0,0,.48)
  );
}

#barra {
  position: absolute;
  top: max(18px, env(safe-area-inset-top));
  left: 18px;
  right: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  text-shadow: 0 1px 5px #000;
}

#titulo {
  font-size: 16px;
  font-weight: bold;
}

#contador {
  font-size: 12px;
  white-space: nowrap;
}

#estado {
  position: absolute;
  top: 10%;
  width: 100%;
  padding: 0 20px;
  text-align: center;
  font-size: 15px;
  text-shadow: 0 1px 5px #000;
}

#marco {
  position: absolute;
  width: min(84vw, 360px, 40dvh);
  height: min(84vw, 360px, 40dvh);
  top: 42%;
  left: 50%;
  transform: translate(-50%, -50%);
  border: 1px solid rgba(255,255,255,.25);
  background: rgba(255,255,255,.025);
  box-shadow: 0 0 0 100vmax rgba(0,0,0,.13);
  overflow: hidden;
}

.esquina {
  position: absolute;
  width: 28px;
  height: 28px;
  border-color: #fff;
  border-style: solid;
  filter: drop-shadow(0 0 2px #000);
}

.sup-izq {
  top: -2px;
  left: -2px;
  border-width: 4px 0 0 4px;
}

.sup-der {
  top: -2px;
  right: -2px;
  border-width: 4px 4px 0 0;
}

.inf-izq {
  bottom: -2px;
  left: -2px;
  border-width: 0 0 4px 4px;
}

.inf-der {
  bottom: -2px;
  right: -2px;
  border-width: 0 4px 4px 0;
}

/* LÍNEA VERDE: MOVIMIENTO CONTINUO, SUAVE Y UNIFORME */
#linea {
  position: absolute;
  top: 0;
  left: 3%;
  right: 3%;
  height: 3px;
  background: #00ff66;
  box-shadow: 0 0 7px #00ff66, 0 0 14px #00ff66;
  animation: barrido 2.2s linear infinite alternate;
  pointer-events: none;
  will-change: top;
}

@keyframes barrido {
  from { top: 0; }
  to { top: calc(100% - 3px); }
}

#instruccion {
  position: absolute;
  top: calc(42% + min(42vw, 180px) + 16px);
  width: 100%;
  padding: 0 14px;
  text-align: center;
  font-size: 16px;
  text-shadow: 0 1px 5px #000;
}

#zonaInferior {
  position: absolute;
  bottom: calc(3% + env(safe-area-inset-bottom));
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 22px;
  pointer-events: auto;
}

.control {
  border: 0;
  background: transparent;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  padding: 8px 10px;
  cursor: pointer;
}

.icono {
  font-size: 28px;
  line-height: 1;
}

#botonQR {
  color: #12a7f5;
  font-weight: bold;
}

#btnApagar {
  color: #ff5555;
  font-weight: bold;
}

#resultado {
  position: absolute;
  z-index: 10;
  top: 16%;
  left: 7%;
  right: 7%;
  display: none;
  padding: 14px;
  text-align: center;
  background: rgba(0,0,0,.90);
  border: 1px solid #555;
  border-radius: 12px;
  font-size: 16px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  pointer-events: none;
}

#resultado.exito {
  border-color: #00ff66;
  color: #00ff66;
}

#resultado.repetido {
  border-color: #ffbf47;
  color: #ffbf47;
}

#btnIniciar {
  position: absolute;
  z-index: 20;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 15px 24px;
  border: 0;
  border-radius: 9px;
  background: #087fc1;
  color: white;
  font-size: 17px;
  font-weight: bold;
  white-space: nowrap;
  box-shadow: 0 4px 18px #0008;
}

.oculto {
  display: none !important;
}

button:disabled {
  opacity: .55;
}

@media (max-height: 600px) {
  #marco {
    top: 39%;
    width: min(62vw, 260px, 38dvh);
    height: min(62vw, 260px, 38dvh);
  }

  #instruccion {
    top: calc(39% + min(31vw, 130px, 19dvh) + 12px);
    font-size: 13px;
  }

  #zonaInferior {
    bottom: calc(1% + env(safe-area-inset-bottom));
    gap: 12px;
  }

  .control {
    padding: 6px;
    font-size: 12px;
  }

  .icono {
    font-size: 25px;
  }

  #estado {
    top: 9%;
    font-size: 13px;
  }
}
</style>
</head>

<body>
<div id="app">

  <div id="lector"></div>

  <div id="interfaz">
    <div id="barra">
      <span id="titulo">Escáner QR - Profesor</span>
      <span id="contador">0 leídos</span>
    </div>

    <div id="estado">Pulse iniciar para activar la cámara</div>

    <div id="marco">
      <span class="esquina sup-izq"></span>
      <span class="esquina sup-der"></span>
      <span class="esquina inf-izq"></span>
      <span class="esquina inf-der"></span>
      <div id="linea"></div>
    </div>

    <div id="instruccion">
      Coloca el código dentro del recuadro
    </div>

    <div id="zonaInferior">

      <button class="control" id="btnLinterna" type="button">
        <span class="icono">🔦</span>
        <span>Linterna</span>
      </button>

      <button class="control" id="botonQR" type="button">
        <span class="icono">▤</span>
        <span>Código QR</span>
      </button>

      <button class="control oculto" id="btnApagar" type="button">
        <span class="icono">⏹</span>
        <span>Apagar lector</span>
      </button>

    </div>
  </div>

  <div id="resultado" role="status" aria-live="polite"></div>

  <button id="btnIniciar" type="button">
    📷 Iniciar escáner
  </button>

</div>

<script>
'use strict';

const $ = id => document.getElementById(id);

let reader = null;
let activo = false;
let iniciando = false;
let apagando = false;
let linterna = false;
let total = 0;
let vozDisponible = null;
let temporizadorMensaje = null;
let temporizadorLiberacion = null;
let codigoEnLectura = '';

const registrosHoy = new Map();

/* Fecha local */
function hoy() {
  const d = new Date();
  const anio = d.getFullYear();
  const mes = String(d.getMonth() + 1).padStart(2, '0');
  const dia = String(d.getDate()).padStart(2, '0');
  return `${anio}-${mes}-${dia}`;
}

/* Selección de voz española */
function cargarVoz() {
  if (!('speechSynthesis' in window)) return;

  const voces = window.speechSynthesis.getVoices();

  vozDisponible =
    voces.find(v => /^es(-|_)/i.test(v.lang) &&
      /BO|ES|MX|AR|419/i.test(v.lang)) ||
    voces.find(v => /^es/i.test(v.lang)) ||
    voces[0] ||
    null;
}

if ('speechSynthesis' in window) {
  cargarVoz();
  window.speechSynthesis.onvoiceschanged = cargarVoz;
}

/* Anuncio por voz */
function hablar(texto) {
  if (!('speechSynthesis' in window)) return;

  cargarVoz();

  const mensaje = new SpeechSynthesisUtterance(texto);

  if (vozDisponible) mensaje.voice = vozDisponible;

  mensaje.lang = vozDisponible?.lang || 'es-ES';
  mensaje.pitch = 1;
  mensaje.rate = 1;
  mensaje.volume = 1;

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(mensaje);
}

/* Mensajes visuales */
function mostrar(texto, tipo = '', duracion = 2500) {
  const caja = $('resultado');

  caja.textContent = texto;
  caja.className = tipo;
  caja.style.display = 'block';

  clearTimeout(temporizadorMensaje);

  temporizadorMensaje = setTimeout(() => {
    caja.style.display = 'none';
    caja.className = '';
  }, duracion);
}

function actualizarContador() {
  $('contador').textContent = total + ' leídos';
}

/* Evita lecturas continuas del mismo QR */
function programarLiberacion(codigo) {
  clearTimeout(temporizadorLiberacion);

  temporizadorLiberacion = setTimeout(() => {
    if (codigoEnLectura === codigo) {
      codigoEnLectura = '';
    }
  }, 1800);
}

/* Procesamiento inmediato del QR */
function procesarQR(textoQR) {
  const codigo = String(textoQR || '').trim();

  if (!codigo || !activo || apagando) return;

  if (codigoEnLectura === codigo) {
    programarLiberacion(codigo);
    return;
  }

  codigoEnLectura = codigo;
  programarLiberacion(codigo);

  total++;
  actualizarContador();

  const fecha = hoy();

  if (registrosHoy.get(codigo) === fecha) {
    mostrar('Ya se encuentra registrado ❗', 'repetido', 3000);
    hablar('Ya se encuentra registrado');
  } else {
    registrosHoy.set(codigo, fecha);
    mostrar('Asistencia registrada correctamente', 'exito', 2500);
    hablar('Asistencia registrada');
  }
}

/* Iniciar cámara trasera en alta resolución */
async function iniciarLector() {
  if (activo || iniciando || apagando) return;

  iniciando = true;
  $('btnIniciar').disabled = true;
  $('estado').textContent = 'Activando cámara trasera en alta resolución…';

  try {
    if (!window.isSecureContext ||
        !navigator.mediaDevices?.getUserMedia) {
      throw new Error(
        'Abre esta página mediante HTTPS y permite el acceso a la cámara.'
      );
    }

    if (typeof Html5Qrcode === 'undefined') {
      throw new Error(
        'No se pudo cargar el lector QR. Comprueba tu conexión a Internet.'
      );
    }

    if (reader) {
      try {
        await reader.stop();
      } catch (_) {}

      try {
        reader.clear();
      } catch (_) {}

      reader = null;
    }

    $('lector').innerHTML = '';

    reader = new Html5Qrcode('lector', {
      verbose: false,
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE
      ],
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    });

    const config = {
      fps: 30,
      qrbox: function(ancho, alto) {
        const lado = Math.floor(Math.min(ancho, alto) * 0.85);
        return { width: lado, height: lado };
      },
      aspectRatio: 1,
      disableFlip: true,
      videoConstraints: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        frameRate: { ideal: 30, max: 60 }
      }
    };

    await reader.start(
      { facingMode: 'environment' },
      config,

      textoQR => {
        procesarQR(textoQR);
      },

      () => {}
    );

    const video = $('lector').querySelector('video');

    if (video) {
      video.setAttribute('playsinline', 'true');
      video.setAttribute('autoplay', 'true');
      video.setAttribute('webkit-playsinline', 'true');
      video.muted = true;
      video.playsInline = true;

      const pistas = video.srcObject?.getVideoTracks() || [];

      if (pistas.length) {
        const pista = pistas[0];

        try {
          await pista.applyConstraints({
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: 30, max: 60 }
          });
        } catch (errorResolucion) {
          console.warn('Se mantiene la resolución compatible.', errorResolucion);
        }

        const ajustes = pista.getSettings();
        console.log('Cámara:', ajustes.facingMode);
        console.log('Resolución:', ajustes.width, 'x', ajustes.height);
        console.log('FPS:', ajustes.frameRate);
      }

      try {
        await video.play();
      } catch (_) {}
    }

    activo = true;
    linterna = false;

    $('btnIniciar').classList.add('oculto');
    $('btnApagar').classList.remove('oculto');
    $('btnLinterna').querySelector('.icono').textContent = '🔦';
    $('estado').textContent = 'Cámara trasera activa';
    $('instruccion').textContent = 'Coloca el código dentro del recuadro';

  } catch (e) {
    console.error('Error al iniciar el lector:', e);

    activo = false;
    $('estado').textContent = 'No se pudo iniciar la cámara';

    let mensajeError = e.message || String(e);

    if (e.name === 'NotAllowedError' ||
        e.name === 'PermissionDeniedError') {
      mensajeError =
        'Permiso de cámara denegado. Abre los ajustes del sitio en Chrome y permite el acceso a la cámara.';
    } else if (e.name === 'NotFoundError' ||
               e.name === 'DevicesNotFoundError') {
      mensajeError = 'No se encontró una cámara disponible en este dispositivo.';
    } else if (e.name === 'NotReadableError' ||
               e.name === 'TrackStartError') {
      mensajeError =
        'La cámara está siendo utilizada por otra aplicación. Ciérrala e inténtalo de nuevo.';
    }

    mostrar(mensajeError, '', 6000);

    if (reader) {
      try {
        await reader.stop();
      } catch (_) {}

      try {
        reader.clear();
      } catch (_) {}

      reader = null;
    }

    $('lector').innerHTML = '';
    $('btnIniciar').classList.remove('oculto');
    $('btnApagar').classList.add('oculto');

  } finally {
    iniciando = false;
    $('btnIniciar').disabled = false;
  }
}

/* APAGAR COMPLETAMENTE EL LECTOR Y LIBERAR LA CÁMARA */
async function apagarLector() {
  if (apagando || iniciando) return;

  apagando = true;
  activo = false;

  clearTimeout(temporizadorLiberacion);
  clearTimeout(temporizadorMensaje);

  codigoEnLectura = '';
  linterna = false;

  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }

  $('estado').textContent = 'Apagando cámara…';
  $('btnApagar').disabled = true;

  try {
    if (reader) {
      try {
        await reader.stop();
      } catch (e) {
        console.warn('La cámara ya estaba detenida.', e);
      }

      try {
        reader.clear();
      } catch (_) {}

      reader = null;
    }

    /* Asegurar la liberación de todas las pistas de vídeo */
    const video = $('lector').querySelector('video');

    if (video && video.srcObject) {
      video.srcObject.getTracks().forEach(pista => pista.stop());
      video.srcObject = null;
    }

    $('lector').innerHTML = '';

    $('resultado').style.display = 'none';
    $('resultado').className = '';

    $('btnLinterna').querySelector('.icono').textContent = '🔦';
    $('btnApagar').classList.add('oculto');
    $('btnIniciar').classList.remove('oculto');

    $('estado').textContent = 'Lector apagado';
    $('instruccion').textContent = 'Pulsa Iniciar escáner para comenzar';

  } finally {
    apagando = false;
    $('btnApagar').disabled = false;
  }
}

/* Linterna */
async function alternarLinterna() {
  if (!reader || !activo || apagando) {
    mostrar('Inicia primero el escáner.');
    return;
  }

  try {
    const nuevoEstado = !linterna;

    await reader.applyVideoConstraints({
      advanced: [{ torch: nuevoEstado }]
    });

    linterna = nuevoEstado;

    $('btnLinterna').querySelector('.icono').textContent =
      linterna ? '💡' : '🔦';

    mostrar(linterna ? 'Linterna encendida' : 'Linterna apagada');

  } catch (e) {
    linterna = false;
    $('btnLinterna').querySelector('.icono').textContent = '🔦';
    mostrar('La linterna no está disponible en este dispositivo.');
  }
}

/* Botones */
$('btnIniciar').addEventListener('click', async () => {
  if (activo || iniciando || apagando) return;

  hablar('Escáner activado. Puede comenzar a registrar asistencias.');
  await iniciarLector();
});

$('botonQR').addEventListener('click', () => {
  if (activo) {
    mostrar('Apunta la cámara al código QR.');
  } else {
    iniciarLector();
  }
});

$('btnLinterna').addEventListener('click', alternarLinterna);
$('btnApagar').addEventListener('click', apagarLector);

/* Regreso a la pestaña */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;

  if (activo) {
    $('estado').textContent = 'Cámara trasera activa';
    $('instruccion').textContent = 'Coloca el código dentro del recuadro';
  } else if (!iniciando && !apagando) {
    $('estado').textContent = 'Pulsa Iniciar escáner para activar la cámara.';
  }
});

/* Limpieza al abandonar la página */
window.addEventListener('pagehide', () => {
  clearTimeout(temporizadorMensaje);
  clearTimeout(temporizadorLiberacion);

  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }

  if (reader && activo) {
    reader.stop().catch(() => {});
  }
});
</script>
</body>
</html>
