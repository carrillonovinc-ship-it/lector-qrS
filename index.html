
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1769aa">
  <title>Escáner QR - Modo Profesor</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px 12px;
      text-align: center;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    h2 { font-size: 22px; }

    .panel {
      max-width: 480px;
      margin: auto;
      padding: 18px 14px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 12px #00000012;
    }

    button {
      width: 100%;
      max-width: 320px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #1769aa;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }

    #lector {
      display: none;
      width: 100%;
      max-width: 400px;
      margin: 14px auto;
      overflow: hidden;
    }

    #lector video {
      width: 100% !important;
      border-radius: 10px;
    }

    #estado {
      font-size: 15px;
      line-height: 1.5;
    }

    #msg {
      font-size: 19px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    #contador {
      font-size: 16px;
      font-weight: bold;
    }

    #ultimo {
      font-size: 13px;
      overflow-wrap: anywhere;
      color: #64748b;
    }

    .verde { color: #16803c; }
    .rojo { color: #b42318; }
  </style>
</head>

<body>
  <h2>📷 Escáner QR - Modo Profesor</h2>

  <div class="panel">
    <p id="estado">Pulse iniciar para activar la cámara.</p>

    <button id="btnIniciar">🔊 Iniciar escáner</button>

    <div id="lector"></div>

    <p id="msg" role="status" aria-live="polite"></p>
    <p id="contador">Solicitudes iniciadas: 0</p>
    <p id="pendientes">Pendientes: 0</p>
    <p id="ultimo">Esperando el primer QR...</p>
  </div>

<script>
"use strict";

const $ = id => document.getElementById(id);

let lector = null;
let iniciando = false;
let activo = false;
let procesandoQR = false;
let voz = null;

let total = 0;
let enCurso = 0;
let ultimoCodigo = "";
let ultimaLectura = 0;

const cola = [];
const pendientes = new Set();
const ultimaSolicitud = new Map();

// Fecha local de Bolivia.
function hoy() {
  const p = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/La_Paz",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const o = Object.fromEntries(p.map(x => [x.type, x.value]));
  return `${o.year}-${o.month}-${o.day}`;
}

function hablar(texto) {
  if (!("speechSynthesis" in window)) return;

  try {
    speechSynthesis.cancel();

    const mensaje = new SpeechSynthesisUtterance(texto);
    mensaje.lang = "es-ES";
    mensaje.rate = 1;
    speechSynthesis.speak(mensaje);
  } catch (e) {
    console.warn("Voz no disponible", e);
  }
}

function esURL(texto) {
  try {
    const u = new URL(texto);

    return (
      (u.protocol === "https:" || u.protocol === "http:") &&
      u.hostname === "script.google.com" &&
      u.pathname.includes("/macros/s/") &&
      u.pathname.endsWith("/exec")
    );
  } catch (e) {
    return false;
  }
}

function actualizarContador() {
  $("contador").textContent =
    "Solicitudes iniciadas: " + total;

  $("pendientes").textContent =
    "Pendientes: " + (cola.length + enCurso);
}

async function iniciarEscaner() {
  if (iniciando || activo) return;

  iniciando = true;
  $("btnIniciar").disabled = true;
  $("estado").textContent = "Activando cámara trasera...";
  $("msg").textContent = "";
  $("lector").style.display = "block";

  try {
    if (!window.isSecureContext ||
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error(
        "Abre el lector en Chrome mediante HTTPS."
      );
    }

    if (typeof Html5Qrcode === "undefined") {
      throw new Error(
        "No se pudo cargar el lector QR. Comprueba Internet."
      );
    }

    lector = new Html5Qrcode("lector");

    // Solicita directamente la cámara trasera.
    await lector.start(
      { facingMode: { ideal: "environment" } },
      {
        fps: 12,
        qrbox: (ancho, alto) => {
          const lado = Math.floor(
            Math.min(ancho, alto, 260)
          );
          return { width: lado, height: lado };
        },
        aspectRatio: 1
      },
      texto => {
        // Nunca se detiene la cámara para enviar una solicitud.
        const ahora = Date.now();
        const codigo = texto.trim();

        // Evita repetir el mismo QR mientras permanece frente
        // a la cámara. Permite volver a leerlo después de 4 s.
        if (codigo === ultimoCodigo &&
            ahora - ultimaLectura < 4000) {
          return;
        }

        ultimoCodigo = codigo;
        ultimaLectura = ahora;

        recibirQR(codigo);
      },
      () => {}
    );

    activo = true;

    $("estado").textContent =
      "🟢 Lector activo. Escanee los QR uno tras otro.";
    $("msg").textContent = "Listo para registrar asistencia.";
    $("msg").className = "verde";
    $("btnIniciar").style.display = "none";

    hablar("Escáner activado. Puede comenzar.");

  } catch (error) {
    console.error("Error al activar cámara:", error);

    activo = false;
    $("lector").style.display = "none";
    $("btnIniciar").style.display = "block";

    if (error.name === "NotAllowedError" ||
        error.name === "PermissionDeniedError") {
      $("estado").textContent =
        "Permita la cámara para este sitio en Chrome y en los ajustes de Android.";
    } else if (error.name === "NotFoundError") {
      $("estado").textContent =
        "No se encontró una cámara disponible.";
    } else if (error.name === "NotReadableError") {
      $("estado").textContent =
        "La cámara está ocupada por otra aplicación.";
    } else {
      $("estado").textContent =
        "No se pudo iniciar: " + (error.message || error);
    }

    if (lector) {
      try { await lector.stop(); } catch (e) {}
      try { await lector.clear(); } catch (e) {}
      lector = null;
    }

  } finally {
    iniciando = false;
    $("btnIniciar").disabled = false;
  }
}

function recibirQR(codigo) {
  if (!codigo) return;

  if (!esURL(codigo)) {
    $("msg").textContent = "QR no válido para este sistema.";
    $("msg").className = "rojo";
    hablar("Código QR no válido");
    return;
  }

  // Si el mismo enlace ya está en la cola, no se duplica.
  if (pendientes.has(codigo)) return;

  // Evita reenvíos accidentales durante unos segundos.
  const ultima = ultimaSolicitud.get(codigo) || 0;
  if (Date.now() - ultima < 4000) return;

  pendientes.add(codigo);
  ultimaSolicitud.set(codigo, Date.now());
  cola.push(codigo);

  $("msg").textContent = "QR leído. Solicitud en proceso...";
  $("msg").className = "verde";
  $("ultimo").textContent = "Último QR: " + codigo;

  actualizarContador();
  procesarCola();
}

async function procesarCola() {
  // Un solo consumidor de la cola; la cámara sigue activa.
  if (procesandoQR) return;
  procesandoQR = true;

  try {
    while (cola.length > 0) {
      const url = cola.shift();

      enCurso++;
      total++;
      actualizarContador();

      try {
        $("estado").textContent =
          "Cámara activa · Enviando asistencia en segundo plano";

        /*
         * GET sin CORS: permite solicitar el endpoint externo
         * sin abandonar la página. La respuesta es opaca:
         * no permite confirmar si Sheets guardó la asistencia.
         */
        await fetch(url, {
          method: "GET",
          mode: "no-cors",
          cache: "no-store",
          redirect: "follow"
        });

        $("msg").textContent =
          "Solicitud enviada al navegador. Lector listo para otro QR.";
        $("msg").className = "verde";

      } catch (error) {
        console.error("Error de red:", error);

        /*
         * Conserva el enlace para un reintento posterior.
         * No se afirma que Google Sheets lo haya guardado.
         */
        cola.unshift(url);

        $("msg").textContent =
          "Sin conexión o solicitud fallida. QR conservado para reintentar.";
        $("msg").className = "rojo";

        // Evita un bucle de reintentos continuo sin conexión.
        await new Promise(resolve => setTimeout(resolve, 2500));
        break;

      } finally {
        enCurso--;
        actualizarContador();
      }
    }
  } finally {
    procesandoQR = false;
    actualizarContador();

    if (cola.length === 0) {
      $("estado").textContent =
        "🟢 Cámara activa · Listo para el siguiente estudiante.";
    }
  }
}

$("btnIniciar").addEventListener("click", iniciarEscaner);
</script>
</body>
</html>
