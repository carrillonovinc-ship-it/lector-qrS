
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Registro de Asistencia - Modo Profesor</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #111;
}

#lector {
  position: absolute;
  inset: 0;
  background: #111;
}

#lector video {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
}

#lector > div {
  border: 0 !important;
}

#lector img,
#lector canvas {
  max-width: 100%;
}

#lector__dashboard_section,
#lector__status_span,
#lector__header_message {
  display: none !important;
}

#interfaz {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.30),
    transparent 27%,
    transparent 70%,
    rgba(0,0,0,.48)
  );
}

#barra {
  position: absolute;
  top: max(18px, env(safe-area-inset-top));
  left: 18px;
  right: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  text-shadow: 0 1px 5px #000;
}

#titulo {
  font-size: 16px;
  font-weight: bold;
}

#contador {
  font-size: 12px;
  white-space: nowrap;
}

#estado {
  position: absolute;
  top: 10%;
  width: 100%;
  padding: 0 20px;
  text-align: center;
  font-size: 15px;
  text-shadow: 0 1px 5px #000;
}

#marco {
  position: absolute;
  width: min(88vw, 430px);
  height: min(88vw, 430px);
  max-height: 48vh;
  top: 36%;
  left: 50%;
  transform: translate(-50%, -50%);
  border: 1px solid rgba(255,255,255,.25);
  background: rgba(255,255,255,.025);
  box-shadow: 0 0 0 100vmax rgba(0,0,0,.13);
}

.esquina {
  position: absolute;
  width: 28px;
  height: 28px;
  border-color: #fff;
  border-style: solid;
  filter: drop-shadow(0 0 2px #000);
}

.sup-izq {
  top: -2px;
  left: -2px;
  border-width: 4px 0 0 4px;
}

.sup-der {
  top: -2px;
  right: -2px;
  border-width: 4px 4px 0 0;
}

.inf-izq {
  bottom: -2px;
  left: -2px;
  border-width: 0 0 4px 4px;
}

.inf-der {
  bottom: -2px;
  right: -2px;
  border-width: 0 4px 4px 0;
}

/* Línea verde animada */

#linea {
  position: absolute;
  top: 50%;
  left: 2%;
  right: 2%;
  height: 2px;
  background: #00ff66;
  box-shadow: 0 0 7px #00ff66, 0 0 14px #00ff66;
  animation: barrido 1.8s ease-in-out infinite alternate;
}

@keyframes barrido {
  from {
    transform: translateY(-min(35vw, 150px));
  }
  to {
    transform: translateY(min(35vw, 150px));
  }
}

#instruccion {
  position: absolute;
  top: calc(36% + min(44vw, 215px) + 16px);
  width: 100%;
  padding: 0 14px;
  text-align: center;
  font-size: 16px;
  text-shadow: 0 1px 5px #000;
}

#zonaInferior {
  position: absolute;
  bottom: calc(5% + env(safe-area-inset-bottom));
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 36px;
  pointer-events: auto;
}

.control {
  border: 0;
  background: transparent;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  padding: 8px 14px;
  cursor: pointer;
}

.icono {
  font-size: 30px;
  line-height: 1;
}

#botonQR {
  color: #12a7f5;
  font-weight: bold;
}

#resultado {
  position: absolute;
  z-index: 10;
  top: 16%;
  left: 7%;
  right: 7%;
  display: none;
  padding: 14px;
  text-align: center;
  background: rgba(0,0,0,.90);
  border: 1px solid #555;
  border-radius: 12px;
  font-size: 16px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  pointer-events: none;
}

#resultado.exito {
  border-color: #00ff66;
  color: #00ff66;
}

#resultado.repetido {
  border-color: #ffbf47;
  color: #ffbf47;
}

#btnIniciar {
  position: absolute;
  z-index: 20;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 15px 24px;
  border: 0;
  border-radius: 9px;
  background: #087fc1;
  color: white;
  font-size: 17px;
  font-weight: bold;
  white-space: nowrap;
  box-shadow: 0 4px 18px #0008;
}

.oculto {
  display: none !important;
}

button:disabled {
  opacity: .55;
}

@media (max-height: 600px) {
  #marco {
    top: 40%;
    width: min(66vw, 300px);
    height: min(66vw, 300px);
    max-height: 43vh;
  }

  #instruccion {
    top: calc(40% + min(33vw, 150px) + 12px);
    font-size: 14px;
  }

  #zonaInferior {
    bottom: calc(2% + env(safe-area-inset-bottom));
  }
}
</style>
</head>

<body>
<div id="app">

  <div id="lector"></div>

  <div id="interfaz">

    <div id="barra">
      <span id="titulo">Escáner QR - Profesor</span>
      <span id="contador">0 leídos</span>
    </div>

    <div id="estado">Pulse iniciar para activar la cámara</div>

    <div id="marco">
      <span class="esquina sup-izq"></span>
      <span class="esquina sup-der"></span>
      <span class="esquina inf-izq"></span>
      <span class="esquina inf-der"></span>
      <div id="linea"></div>
    </div>

    <div id="instruccion">
      Coloca el código dentro del recuadro
    </div>

    <div id="zonaInferior">

      <button class="control" id="btnLinterna" type="button">
        <span class="icono">🔦</span>
        <span>Linterna</span>
      </button>

      <button class="control" id="botonQR" type="button">
        <span class="icono">▤</span>
        <span>Código QR</span>
      </button>

    </div>
  </div>

  <div id="resultado" role="status" aria-live="polite"></div>

  <button id="btnIniciar" type="button">
    📷 Iniciar escáner
  </button>

</div>

<script>
'use strict';

const $ = id => document.getElementById(id);

let reader = null;
let activo = false;
let iniciando = false;
let linterna = false;
let total = 0;
let vozDisponible = null;
let temporizadorMensaje = null;
let temporizadorLiberacion = null;
let ultimoCodigo = '';
let ventanaEnlaces = null;

/*
 * Registros realizados durante esta sesión.
 * La clave es el contenido completo del QR.
 */
const registrosHoy = new Map();

/*
 * Evita que un mismo QR detectado continuamente
 * provoque múltiples registros y anuncios.
 */
let codigoEnLectura = '';

/* Fecha local, sin desplazamiento UTC. */
function hoy() {
  const d = new Date();
  const anio = d.getFullYear();
  const mes = String(d.getMonth() + 1).padStart(2, '0');
  const dia = String(d.getDate()).padStart(2, '0');

  return `${anio}-${mes}-${dia}`;
}

/* Selección de voz española. */
function cargarVoz() {
  if (!('speechSynthesis' in window)) return;

  const voces = window.speechSynthesis.getVoices();

  vozDisponible =
    voces.find(v => /^es(-|_)/i.test(v.lang) &&
                    /BO|ES|MX|AR|419/i.test(v.lang)) ||
    voces.find(v => /^es/i.test(v.lang)) ||
    voces[0] ||
    null;
}

if ('speechSynthesis' in window) {
  cargarVoz();
  window.speechSynthesis.onvoiceschanged = cargarVoz;
}

/* Anuncio por voz. */
function hablar(texto) {
  if (!('speechSynthesis' in window)) return;

  cargarVoz();

  const mensaje = new SpeechSynthesisUtterance(texto);

  if (vozDisponible) {
    mensaje.voice = vozDisponible;
  }

  mensaje.lang = vozDisponible?.lang || 'es-ES';
  mensaje.pitch = 1;
  mensaje.rate = 1;
  mensaje.volume = 1;

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(mensaje);
}

/* Mensajes visuales temporales. */
function mostrar(texto, tipo = '', duracion = 2500) {
  const caja = $('resultado');

  caja.textContent = texto;
  caja.className = tipo;
  caja.style.display = 'block';

  clearTimeout(temporizadorMensaje);

  temporizadorMensaje = setTimeout(() => {
    caja.style.display = 'none';
    caja.className = '';
  }, duracion);
}

function actualizarContador() {
  $('contador').textContent = total + ' leídos';
}

/* Solo se aceptan direcciones HTTP y HTTPS. */
function esURL(texto) {
  try {
    const u = new URL(texto);

    return (
      (u.protocol === 'https:' || u.protocol === 'http:') &&
      !!u.hostname
    );
  } catch (_) {
    return false;
  }
}

/*
 * Prepara una pestaña secundaria desde el botón inicial,
 * cuando todavía existe una acción directa del usuario.
 *
 * El navegador puede impedirla por sus políticas.
 * No es posible obligar a Chrome a abrir pestañas en segundo plano.
 */
function prepararVentanaEnlaces() {
  try {
    if (!ventanaEnlaces || ventanaEnlaces.closed) {
      ventanaEnlaces = window.open(
        'about:blank',
        'ventanaEnlacesQR'
      );
    }
  } catch (e) {
    console.warn('No se pudo preparar la pestaña:', e);
  }
}

/*
 * Envía el enlace a la pestaña secundaria.
 * Se reutiliza la misma pestaña para no crear una nueva
 * por cada lectura.
 */
function abrirEnlace(url) {
  if (!esURL(url)) return false;

  try {
    if (!ventanaEnlaces || ventanaEnlaces.closed) {
      prepararVentanaEnlaces();
    }

    if (ventanaEnlaces && !ventanaEnlaces.closed) {
      ventanaEnlaces.location.href = url;
      return true;
    }

    /*
     * Intento adicional. Puede ser bloqueado por Chrome
     * porque la lectura automática no es un clic del usuario.
     */
    const nueva = window.open(url, '_blank');

    if (nueva) {
      ventanaEnlaces = nueva;
      return true;
    }
  } catch (e) {
    console.warn('El navegador impidió abrir el enlace:', e);
  }

  return false;
}

/*
 * Libera el QR cuando deja de detectarse durante un tiempo.
 * Así, si se retira y se vuelve a presentar, se considera
 * una nueva lectura y se comprueba si ya estaba registrado.
 */
function programarLiberacion(codigo) {
  clearTimeout(temporizadorLiberacion);

  temporizadorLiberacion = setTimeout(() => {
    if (codigoEnLectura === codigo) {
      codigoEnLectura = '';
    }
  }, 1800);
}

/* Procesamiento de cada lectura aceptada. */
function procesarQR(textoQR) {
  const codigo = String(textoQR || '').trim();

  if (!codigo || !activo) return;

  /*
   * Mantiene bloqueada la lectura mientras el mismo QR
   * continúa visible ante la cámara.
   */
  if (codigoEnLectura === codigo) {
    programarLiberacion(codigo);
    return;
  }

  codigoEnLectura = codigo;
  programarLiberacion(codigo);

  total++;
  actualizarContador();

  const fecha = hoy();
  const fechaRegistro = registrosHoy.get(codigo);

  if (fechaRegistro === fecha) {
    mostrar('Ya se encuentra registrado ❗', 'repetido', 3000);
    hablar('Ya se encuentra registrado');
  } else {
    registrosHoy.set(codigo, fecha);

    mostrar('Asistencia registrada correctamente', 'exito', 2500);
    hablar('Asistencia registrada');
  }

  /*
   * Si contiene un enlace, se intenta abrir tanto en la
   * primera lectura como cuando el mismo QR se vuelve
   * a presentar posteriormente.
   */
  if (esURL(codigo)) {
    const abierto = abrirEnlace(codigo);

    if (!abierto) {
      mostrar(
        'QR leído. Chrome bloqueó la apertura automática. ' +
        'Permite las ventanas emergentes para abrir el enlace.',
        '',
        4500
      );
    }
  }
}

/* Inicio del escáner. */
async function iniciarLector() {
  if (activo || iniciando) return;

  iniciando = true;
  $('btnIniciar').disabled = true;
  $('estado').textContent = 'Activando cámara trasera…';

  try {
    if (!window.isSecureContext ||
        !navigator.mediaDevices?.getUserMedia) {
      throw new Error(
        'Abre esta página mediante HTTPS y permite el acceso a la cámara.'
      );
    }

    if (typeof Html5Qrcode === 'undefined') {
      throw new Error(
        'No se pudo cargar el lector QR. Comprueba tu conexión a Internet.'
      );
    }

    if (reader) {
      try {
        await reader.stop();
      } catch (_) {}

      try {
        reader.clear();
      } catch (_) {}

      reader = null;
    }

    const lectorDiv = $('lector');
    lectorDiv.innerHTML = '';

    reader = new Html5Qrcode('lector', {
      verbose: false,
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE
      ],
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    });

    const lado = Math.max(
      160,
      Math.floor(
        Math.min(
          window.innerWidth * 0.84,
          window.innerHeight * 0.46,
          420
        )
      )
    );

    const config = {
      fps: 20,
      qrbox: {
        width: lado,
        height: lado
      },
      aspectRatio: 1,
      disableFlip: false
    };

    await reader.start(
      { facingMode: 'environment' },
      config,

      /* No detener la cámara después de cada lectura. */
      textoQR => {
        procesarQR(textoQR);
      },

      /* Los errores normales de detección se ignoran. */
      () => {}
    );

    activo = true;
    linterna = false;

    $('btnIniciar').classList.add('oculto');
    $('estado').textContent = 'Cámara activa';
    $('instruccion').textContent =
      'Coloca el código dentro del recuadro';

  } catch (e) {
    console.error('Error al iniciar el lector:', e);

    activo = false;
    $('estado').textContent = 'No se pudo iniciar la cámara';

    mostrar(
      e.message || String(e),
      '',
      4500
    );

    if (reader) {
      try {
        await reader.stop();
      } catch (_) {}

      try {
        reader.clear();
      } catch (_) {}

      reader = null;
    }

    $('btnIniciar').classList.remove('oculto');

  } finally {
    iniciando = false;
    $('btnIniciar').disabled = false;
  }
}

/* Control de la linterna. */
async function alternarLinterna() {
  if (!reader || !activo) {
    mostrar('Inicia primero el escáner.');
    return;
  }

  try {
    const nuevoEstado = !linterna;

    await reader.applyVideoConstraints({
      advanced: [{ torch: nuevoEstado }]
    });

    linterna = nuevoEstado;

    $('btnLinterna').querySelector('.icono').textContent =
      linterna ? '💡' : '🔦';

    mostrar(
      linterna ? 'Linterna encendida' : 'Linterna apagada'
    );

  } catch (e) {
    linterna = false;

    $('btnLinterna').querySelector('.icono').textContent = '🔦';

    mostrar('La linterna no está disponible en este dispositivo.');
  }
}

/* Activación inicial mediante interacción del usuario. */
$('btnIniciar').addEventListener('click', async () => {
  if (activo || iniciando) return;

  /*
   * Se intenta preparar la pestaña secundaria mientras
   * el navegador todavía reconoce el clic del usuario.
   */
  prepararVentanaEnlaces();

  hablar(
    'Escáner activado. Puede comenzar a registrar asistencias.'
  );

  await iniciarLector();
});

/* Botón de escaneo. */
$('botonQR').addEventListener('click', () => {
  if (activo) {
    mostrar('Apunta la cámara al código QR.');
  } else {
    iniciarLector();
  }
});

/* Botón de linterna. */
$('btnLinterna').addEventListener('click', alternarLinterna);

/* Recuperación al regresar a la pestaña del lector. */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;

  if (activo) {
    $('estado').textContent = 'Cámara activa';
    $('instruccion').textContent =
      'Coloca el código dentro del recuadro';
  } else if (!iniciando) {
    $('estado').textContent =
      'Pulsa iniciar para activar la cámara.';
  }
});

/* Limpiar temporizadores al abandonar la página. */
window.addEventListener('pagehide', () => {
  clearTimeout(temporizadorMensaje);
  clearTimeout(temporizadorLiberacion);
});
</script>
</body>
</html>
