
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Registro de Asistencia - Modo Profesor</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px 12px;
      background: #f3f6fa;
      color: #1f2937;
    }

    h2 { font-size: 23px; }

    button {
      padding: 13px 20px;
      margin: 8px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 9px;
      cursor: pointer;
    }

    #btnIniciar { background: #1769aa; color: white; }
    #btnReintentar { background: #e5a000; color: #111; }
    #lector {
      width: 100%;
      max-width: 400px;
      margin: 15px auto;
      display: none;
    }

    #msg {
      font-size: 18px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    #contador {
      font-size: 16px;
      font-weight: bold;
    }

    #estado {
      font-size: 14px;
      color: #4b5563;
    }

    #ultimoEnlace {
      display: block;
      overflow-wrap: anywhere;
      margin: 12px auto;
    }

    .panel {
      max-width: 520px;
      margin: 15px auto;
      padding: 15px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000012;
    }
  </style>
</head>

<body>
  <h2>📷 Escáner QR - Modo Profesor</h2>

  <div class="panel">
    <button id="btnIniciar">🔊 Iniciar escáner</button>

    <p id="estado">Esperando para iniciar...</p>
    <p id="msg" role="status" aria-live="polite"></p>
    <p id="contador">Enlaces procesados: 0</p>

    <div id="lector"></div>

    <p>Último enlace leído:</p>
    <a id="ultimoEnlace" href="#" target="_blank"
       rel="noopener noreferrer" hidden>
      Abrir último enlace
    </a>

    <button id="btnReintentar" hidden>
      🔁 Abrir último enlace otra vez
    </button>
  </div>

<script>
  let reader = null;
  let iniciando = false;
  let procesando = false;
  let ventanaEnvio = null;
  let vozDisponible = null;
  let ultimoEnlace = "";
  let totalEnlaces = 0;
  let temporizadorReinicio = null;

  // Cola para no omitir enlaces por lecturas consecutivas.
  const cola = [];
  const codigosEnCola = new Set();

  // Los códigos que no son URL se controlan por día.
  let registrosHoy = cargarRegistros();

  const $ = id => document.getElementById(id);

  function hoy() {
    const partes = new Intl.DateTimeFormat("en-CA", {
      timeZone: "America/La_Paz",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());

    const p = Object.fromEntries(
      partes.map(x => [x.type, x.value])
    );

    return `${p.year}-${p.month}-${p.day}`;
  }

  function cargarRegistros() {
    try {
      return JSON.parse(
        localStorage.getItem("asistenciaQR_" + hoy()) || "{}"
      );
    } catch (e) {
      return {};
    }
  }

  function guardarRegistros() {
    try {
      localStorage.setItem(
        "asistenciaQR_" + hoy(),
        JSON.stringify(registrosHoy)
      );
    } catch (e) {
      console.warn("No se pudo guardar el registro local.", e);
    }
  }

  function cargarVoz() {
    if (!("speechSynthesis" in window)) return;

    const voces = speechSynthesis.getVoices();
    vozDisponible =
      voces.find(v => /^es(-|_)/i.test(v.lang)) ||
      voces[0] || null;
  }

  if ("speechSynthesis" in window) {
    speechSynthesis.onvoiceschanged = cargarVoz;
    cargarVoz();
  }

  function hablar(texto) {
    if (!("speechSynthesis" in window)) return;

    cargarVoz();

    const mensaje = new SpeechSynthesisUtterance(texto);
    mensaje.lang = vozDisponible?.lang || "es-ES";
    if (vozDisponible) mensaje.voice = vozDisponible;
    mensaje.rate = 1;
    mensaje.pitch = 1;

    speechSynthesis.cancel();
    speechSynthesis.speak(mensaje);
  }

  function esEnlace(texto) {
    try {
      const u = new URL(texto);
      return u.protocol === "https:" || u.protocol === "http:";
    } catch (e) {
      return false;
    }
  }

  function mostrarEnlace(url) {
    ultimoEnlace = url;

    $("ultimoEnlace").href = url;
    $("ultimoEnlace").textContent = "Abrir último enlace leído";
    $("ultimoEnlace").hidden = false;
    $("btnReintentar").hidden = false;
  }

  function detenerLector() {
    clearTimeout(temporizadorReinicio);
    temporizadorReinicio = null;

    if (!reader) return Promise.resolve();

    const anterior = reader;
    reader = null;

    return anterior.stop()
      .catch(() => {})
      .then(() => anterior.clear().catch(() => {}));
  }

  async function iniciarLector() {
    if (iniciando || reader || procesando) return;

    iniciando = true;
    $("lector").style.display = "block";
    $("estado").textContent = "Activando cámara...";

    try {
      const nuevo = new Html5Qrcode("lector");
      reader = nuevo;

      await nuevo.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: (w, h) => {
            const lado = Math.floor(Math.min(w, h, 280));
            return { width: lado, height: lado };
          },
          aspectRatio: 1
        },
        textoQR => {
          // Bloquea nuevas lecturas mientras se procesa esta.
          if (procesando) return;

          procesando = true;
          const codigo = textoQR.trim();

          detenerLector().then(() => procesarCodigo(codigo));
        },
        () => {}
      );

      $("estado").textContent = "🟢 Cámara activa. Escanee el QR.";
    } catch (error) {
      reader = null;
      $("estado").textContent =
        "No se pudo iniciar la cámara. Verifique los permisos.";
      $("msg").textContent = String(error);
    } finally {
      iniciando = false;
    }
  }

  async function procesarCodigo(codigo) {
    try {
      if (!codigo) {
        hablar("Código vacío");
        return;
      }

      $("msg").textContent = "QR leído correctamente.";

      if (esEnlace(codigo)) {
        // Los enlaces nunca se descartan por el control diario.
        mostrarEnlace(codigo);

        if (!codigosEnCola.has(codigo)) {
          cola.push(codigo);
          codigosEnCola.add(codigo);
        }

        hablar("Enlace leído. Procesando envío.");
        await procesarCola();
      } else {
        // Para QR que contienen códigos y no enlaces.
        const fecha = hoy();

        if (registrosHoy[codigo] === fecha) {
          $("msg").textContent = "Ya se encuentra registrado ❗";
          hablar("Ya se encuentra registrado");
        } else {
          registrosHoy[codigo] = fecha;
          guardarRegistros();

          $("msg").textContent = "Código registrado localmente ✅";
          hablar("Código registrado");
        }
      }
    } catch (error) {
      console.error(error);
      $("msg").textContent = "Error al procesar el QR.";
      hablar("Ocurrió un error al procesar el código");
    } finally {
      // Deja un breve intervalo antes de reactivar la cámara.
      temporizadorReinicio = setTimeout(async () => {
        procesando = false;
        await iniciarLector();
      }, 1200);
    }
  }

  async function procesarCola() {
    while (cola.length > 0) {
      const url = cola.shift();

      try {
        $("estado").textContent = "Abriendo enlace de asistencia...";

        // Se prepara desde el clic del usuario para reducir
        // los bloqueos de ventanas emergentes.
        if (!ventanaEnvio || ventanaEnvio.closed) {
          throw new Error("VENTANA_CERRADA");
        }

        // No cerrar automáticamente: Google necesita tiempo
        // para recibir y procesar la petición.
        ventanaEnvio.location.href = url;

        totalEnlaces++;
        $("contador").textContent =
          "Enlaces abiertos: " + totalEnlaces;

        $("msg").textContent =
          "Enlace enviado al navegador. Verifique el resultado.";

        // Pausa entre solicitudes para evitar reemplazar una
        // navegación antes de que el servidor la procese.
        await new Promise(resolve => setTimeout(resolve, 1800));

      } catch (error) {
        console.error("No se pudo abrir el enlace:", error);

        // Conserva el enlace para reintentar manualmente.
        cola.unshift(url);
        $("estado").textContent =
          "No se pudo abrir automáticamente. Use el botón de reintento.";

        mostrarEnlace(url);
        break;
      } finally {
        codigosEnCola.delete(url);
      }
    }

    if (cola.length === 0) {
      $("estado").textContent =
        "Procesamiento de la cola terminado. Esto no confirma el guardado.";
    }
  }

  $("btnIniciar").addEventListener("click", async () => {
    // Abrir la ventana durante el clic real del usuario.
    // Mantenerla abierta evita el cierre prematuro.
    ventanaEnvio = window.open("about:blank", "ventanaAsistencia");

    if (!ventanaEnvio) {
      $("estado").textContent =
        "El navegador bloqueó la ventana. Permita ventanas emergentes y vuelva a iniciar.";
      return;
    }

    $("btnIniciar").disabled = true;
    hablar("Escáner activado. Puede comenzar a registrar asistencias.");

    await iniciarLector();

    $("btnIniciar").disabled = false;
  });

  $("btnReintentar").addEventListener("click", () => {
    if (!ultimoEnlace) return;

    // El clic permite al navegador abrir la URL directamente.
    const nuevaVentana = window.open(ultimoEnlace, "_blank");

    if (!nuevaVentana) {
      $("estado").textContent =
        "Ventana bloqueada. Abra el enlace azul manualmente.";
    }
  });

  window.addEventListener("beforeunload", () => {
    if (reader) reader.stop().catch(() => {});
  });
</script>
</body>
</html>
